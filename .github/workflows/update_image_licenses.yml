name: Update Media Assets

# Runs on the 1st of every month at 03:00 UTC, and on manual trigger.
# Downloads the Klexikon ZIM, extracts all media metadata, queries
# Wikimedia Commons for license info, downloads permitted audio files,
# and publishes the results as GitHub Release Assets.
#
# Two-job design to avoid Wikimedia rate limits:
#   Job 1 (prepare):  ZIM download + license generation + audio discovery
#                     → publishes media_licenses.json immediately
#                     → uploads wikipedia_audio_refs.json as artifact
#   Job 2 (download): waits 3600 s for rate-limit reset, then downloads
#                     and publishes the audio package
#
# Manual test run with limited articles:
#   Go to Actions → Update Media Assets → Run workflow
#   Set "max_articles" to e.g. 10

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Max HTML articles to scan for audio (0 = all, 10 = quick test)'
        required: false
        default: '0'

env:
  ZIM_VERSION: klexikon_de_all_maxi_2026-05
  ZIM_URL: https://ftp.fau.de/kiwix/zim/other/klexikon_de_all_maxi_2026-05.zim

jobs:
  # ── Job 1: API-intensive steps ───────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create/update GitHub Releases

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install requests zstandard

      - name: Download ZIM file
        run: |
          echo "Downloading $ZIM_URL"
          curl -fsSL -o klexikon.zim "$ZIM_URL"
          ls -lh klexikon.zim

      # ── Step 0 (optional): Dump article HTML for caption debugging ─────────
      - name: Dump article HTML structure (diagnostic)
        if: ${{ inputs.max_articles != '0' }}
        run: python scripts/dump_article_html.py
        env:
          ZIM_FILE: klexikon.zim
          ARTICLE: Beethoven
          CONTEXT: '1500'

      # ── Step 1: Image + audio metadata from ZIM binary ──────────────────────
      - name: Generate media_licenses.json
        run: python scripts/generate_license_json.py
        env:
          ZIM_FILE: klexikon.zim
          ZIM_VERSION: ${{ env.ZIM_VERSION }}

      # ── Step 2: Audio links from article HTML (wpDestFile= pattern) ─────────
      - name: Extract audio refs from article HTML
        run: python scripts/extract_article_audio.py
        env:
          ZIM_FILE: klexikon.zim
          MAX_ARTICLES: ${{ inputs.max_articles || '0' }}

      # ── Step 2b: Wikipedia-Audio-Dateien suchen (Tierlaute, Musik, etc.) ───
      - name: Find Wikipedia audio files
        run: python scripts/find_wikipedia_audio.py
        env:
          ZIM_FILE:      klexikon.zim
          ZIM_VERSION:   ${{ env.ZIM_VERSION }}
          MAX_ARTICLES:  ${{ inputs.max_articles || '0' }}
          LICENSES_FILE: media_licenses.json

      # ── Pass refs + licenses to downstream jobs via artifacts ───────────────
      - name: Upload audio refs artifact
        uses: actions/upload-artifact@v5
        with:
          name: audio-refs
          path: wikipedia_audio_refs.json
          retention-days: 1

      - name: Upload licenses artifact
        uses: actions/upload-artifact@v5
        with:
          name: media-licenses
          path: media_licenses.json
          retention-days: 1

      # ── Upload: image license data → Cloudflare R2 ──────────────────────────
      - name: Upload media_licenses.json to Cloudflare R2
        run: |
          aws s3 cp media_licenses.json \
            s3://${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}/media_licenses.json \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com \
            --content-type application/json \
            --cache-control "public, max-age=86400"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto

      # ── Publish: image license data (GitHub Release — backup) ────────────────
      - name: Publish image license data
        run: |
          gh release delete image-licenses --yes 2>/dev/null || true
          gh release create image-licenses \
            --title "Image License Data ($ZIM_VERSION)" \
            --notes "Auto-generated Wikimedia Commons license data for \`$ZIM_VERSION\`.

          The Wissensfreund app downloads this file on first start to check which images may be displayed (CC0 / CC BY / CC BY-SA only).

          Updated automatically on the 1st of every month." \
            --latest=false \
            media_licenses.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIM_VERSION: ${{ env.ZIM_VERSION }}

  # ── Job 2: Download audio (after rate-limit reset) ───────────────────────────
  download:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: write   # required to create/update GitHub Releases

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install requests

      - name: Download audio refs artifact
        uses: actions/download-artifact@v5
        with:
          name: audio-refs

      # ── 3600 s pause so Wikimedia rate-limit resets after Job 1 ─────────────
      - name: Wait for Wikimedia rate-limit reset
        run: |
          echo "Warte 3600 s damit das Wikimedia-Rate-Limit nach Job 1 zurueckgesetzt wird..."
          sleep 3600

      # ── Step 3+4: License check, download, ZIP + index ──────────────────────
      - name: Download audio files and build package
        run: python scripts/download_audio.py
        env:
          ZIM_VERSION: ${{ env.ZIM_VERSION }}
          REFS_FILE:   wikipedia_audio_refs.json

      # ── Upload: audio package → Cloudflare R2 ───────────────────────────────
      - name: Upload audio package to Cloudflare R2
        run: |
          aws s3 cp audio_index.json \
            s3://${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}/audio_index.json \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com \
            --content-type application/json \
            --cache-control "public, max-age=86400"
          aws s3 cp wissensfreund_audio.zip \
            s3://${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}/wissensfreund_audio.zip \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com \
            --content-type application/zip \
            --cache-control "public, max-age=86400"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto

      # ── Publish: audio package (GitHub Release — backup) ─────────────────────
      - name: Publish audio package
        run: |
          gh release delete wissensfreund-audio --yes 2>/dev/null || true
          gh release create wissensfreund-audio \
            --title "Audio Package ($ZIM_VERSION)" \
            --notes "Wikimedia Commons audio files linked in Klexikon articles (\`$ZIM_VERSION\`).

          Files: wissensfreund_audio.zip (CC0/CC BY/CC BY-SA, max 5 MB each, max 50 MB total) and audio_index.json (article to audio file mapping).

          The Wissensfreund app downloads this package on first start for offline audio playback. Updated automatically on the 1st of every month." \
            --latest \
            wissensfreund_audio.zip audio_index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIM_VERSION: ${{ env.ZIM_VERSION }}

  # ── Job 3: Build 800px image library (parallel to download, after prepare) ───
  images:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install requests

      - name: Download licenses artifact
        uses: actions/download-artifact@v5
        with:
          name: media-licenses

      # ── Same 3600 s pause as the download job ─────────────────────────────
      - name: Wait for Wikimedia rate-limit reset
        run: |
          echo "Warte 3600 s damit das Wikimedia-Rate-Limit nach Job 1 zurueckgesetzt wird..."
          sleep 3600

      # ── Incremental 800px image download and ZIP rebuild ──────────────────
      - name: Build image library (incremental)
        run: python scripts/download_images.py
        env:
          LICENSES_FILE: media_licenses.json
          ZIM_VERSION:   ${{ env.ZIM_VERSION }}
          R2_BASE_URL:   https://pub-07f0107be14b48fd8652e5318441c7c2.r2.dev
          MAX_IMAGES:    ${{ inputs.max_articles || '0' }}

      # ── Upload: image library → Cloudflare R2 ────────────────────────────
      - name: Upload image library to Cloudflare R2
        run: |
          aws s3 cp images_medium.zip \
            s3://${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}/images_medium.zip \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com \
            --content-type application/zip \
            --cache-control "public, max-age=86400"
          aws s3 cp images_medium_manifest.json \
            s3://${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}/images_medium_manifest.json \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com \
            --content-type application/json \
            --cache-control "public, max-age=86400"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
