name: verify-project-facts
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pandas openpyxl
      - name: Verify project facts
        run: python verify_project_facts.py
