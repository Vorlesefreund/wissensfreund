name: Diagnose ZIM Image Entries

# Manual trigger only — runs diagnose_zim.py on the current Klexikon ZIM
# to count ALL image entries, check compression types, and sample HTML articles.
#
# Go to Actions → Diagnose ZIM Image Entries → Run workflow

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Number of HTML articles to sample for <img> tags (default: 50)'
        required: false
        default: '50'
        type: string

env:
  ZIM_URL: https://ftp.fau.de/kiwix/zim/other/klexikon_de_all_maxi_2026-05.zim

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install zstandard

      - name: Download ZIM file
        run: |
          echo "Downloading $ZIM_URL"
          curl -fsSL -o klexikon.zim "$ZIM_URL"
          ls -lh klexikon.zim

      - name: Run ZIM diagnostic
        run: python scripts/diagnose_zim.py
        env:
          ZIM_FILE: klexikon.zim
          MAX_ARTICLES: ${{ inputs.max_articles || '50' }}

      - name: Run deduplication + size analysis
        run: python scripts/diagnose_zim.py
        env:
          ZIM_FILE: klexikon.zim
          MODE: dedup
