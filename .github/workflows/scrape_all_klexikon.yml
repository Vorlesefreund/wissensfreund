name: Scrape All Klexikon Images

# Vollrun: alle ~3.500 Artikel scrapen → article_image_map.json
# Nur SCHRITT 1+3+4 (SKIP_COMMONS=1) → ~60 Min Laufzeit
# Run: Actions → Scrape All Klexikon Images → Run workflow

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Max. Artikel (0 = alle ~3500)'
        required: false
        default: '0'
        type: string
      delay:
        description: 'Sekunden zwischen Requests'
        required: false
        default: '0.8'
        type: string

env:
  ZIM_URL: https://ftp.fau.de/kiwix/zim/other/klexikon_de_all_maxi_2026-05.zim

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install zstandard

      - name: Download ZIM
        run: |
          curl -fsSL -o klexikon.zim "$ZIM_URL"
          ls -lh klexikon.zim

      - name: Scrape alle Artikel
        run: python scripts/scrape_klexikon_images.py
        env:
          ZIM_FILE:     klexikon.zim
          ALL_ARTICLES: '1'
          SKIP_COMMONS: '1'
          MAX_ARTICLES: ${{ inputs.max_articles || '0' }}
          DELAY:        ${{ inputs.delay || '0.8' }}
          OUTPUT:       article_image_map.json

      - name: Zusammenfassung
        if: always()
        run: |
          echo "=== run_summary.json ==="
          cat run_summary.json 2>/dev/null || echo "(nicht vorhanden)"
          echo ""
          echo "=== Gallery-Artikel (erste 20) ==="
          python3 -c "
          import json, sys
          try:
              data = json.load(open('gallery_articles.json', encoding='utf-8'))
          except Exception as e:
              print(f'Fehler: {e}'); sys.exit(0)
          print(f'Gallery-Artikel gesamt: {len(data)}')
          for r in data[:20]:
              print(f'  {r[\"article\"]:25s}  live={r[\"live_count\"]}  zim={r[\"zim_count\"]}  gap={r[\"gap\"]}')
          " 2>/dev/null || true

      - name: Generate image_index.json
        run: python scripts/generate_image_index.py
        env:
          INPUT:  article_image_map.json
          OUTPUT: image_index.json

      - name: Upload image_index.json nach R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com"
          aws s3 cp image_index.json \
            "s3://${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}/image_index.json" \
            --endpoint-url "$ENDPOINT" --no-progress
          echo "✓ image_index.json auf R2"

      - name: Upload Ergebnisse
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: article-image-map
          path: |
            article_image_map.json
            gallery_articles.json
            run_summary.json
            image_index.json
          retention-days: 30
