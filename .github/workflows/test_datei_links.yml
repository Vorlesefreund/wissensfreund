name: Test Datei-Links in ZIM-HTML

# Prüft ob ZIM-HTML <a href="/wiki/Datei:..."><img> enthält.
# Wenn ja: MD5-Hash → Dateiname offline aus ZIM extrahierbar.
#
# Run: Actions → Test Datei-Links → Run workflow
# Dauer: ~5 Min (ZIM-Download + 5 Artikel)

on:
  workflow_dispatch:

env:
  ZIM_URL: https://ftp.fau.de/kiwix/zim/other/klexikon_de_all_maxi_2026-05.zim

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install zstandard

      - name: Download ZIM
        run: |
          echo "Downloading $ZIM_URL"
          curl -fsSL -o klexikon.zim "$ZIM_URL"
          ls -lh klexikon.zim

      - name: Test Datei-Links
        run: python scripts/test_datei_links.py
        env:
          ZIM_FILE: klexikon.zim
