name: ZIM → JSON Konvertierung

# Nur manuell triggerbar — läuft bei neuer ZIM-Datei (~monatlich).
# Ergebnis landet in R2 Staging: staging/articles_zim/
# Danach startet quiz_and_upload.yml automatisch.
# Benötigte GitHub Secrets: CF_R2_ACCESS_KEY_ID, CF_R2_SECRET_ACCESS_KEY, CF_ACCOUNT_ID

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-Run (nur 10 Artikel, kein Upload)"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"
  ZIM_URL:        "https://ftp.fau.de/kiwix/zim/other/klexikon_de_all_maxi_2026-05.zim"
  IMAGE_MAP_URL:  "https://pub-07f0107be14b48fd8652e5318441c7c2.r2.dev/image_index.json"
  ARTICLES_DIR:   "articles_zim"
  R2_BUCKET:      "wissensfreund-articles"

jobs:

  convert:
    name: "ZIM laden + konvertieren + nach R2 Staging"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install libzim beautifulsoup4

      - name: ZIM herunterladen
        run: |
          echo "Lade ZIM: ${{ env.ZIM_URL }}"
          curl -fsSL -o klexikon.zim "${{ env.ZIM_URL }}"
          ls -lh klexikon.zim

      - name: image_index.json herunterladen
        run: |
          curl -fsSL -o image_map.json "${{ env.IMAGE_MAP_URL }}" \
            && echo "image_map.json: $(wc -l < image_map.json) Zeilen" \
            || echo "image_map.json nicht verfügbar — Bilder ohne thumb_url"

      - name: ZIM konvertieren
        run: |
          ARGS="--zim klexikon.zim --out-dir ${{ env.ARTICLES_DIR }}"
          if [ -f image_map.json ]; then
            ARGS="$ARGS --image-map image_map.json"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/convert_zim_to_json.py $ARGS

      - name: Konvertierungs-Zusammenfassung
        if: always()
        run: |
          OK=$(find "${{ env.ARTICLES_DIR }}" -maxdepth 1 -name "*.json" 2>/dev/null | wc -l)
          ERR=$(find "${{ env.ARTICLES_DIR }}/_errors" -name "*.json" 2>/dev/null | wc -l || echo 0)
          echo "### Konvertierung" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Artikel konvertiert: **$OK**" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Fehler: **$ERR**" >> $GITHUB_STEP_SUMMARY
          echo "- 🔬 Dry-Run: **${{ inputs.dry_run }}**" >> $GITHUB_STEP_SUMMARY

      - name: rclone installieren
        if: ${{ inputs.dry_run != true }}
        run: curl https://rclone.org/install.sh | bash

      - name: Artikel nach R2 Staging hochladen
        if: ${{ inputs.dry_run != true }}
        env:
          CF_R2_ACCESS_KEY_ID:     ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID:           ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rclone config create r2 s3 \
            provider=Cloudflare \
            access_key_id="$CF_R2_ACCESS_KEY_ID" \
            secret_access_key="$CF_R2_SECRET_ACCESS_KEY" \
            endpoint="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --non-interactive

          echo "Starte Staging-Upload..."
          rclone sync "${{ env.ARTICLES_DIR }}/" \
            "r2:${{ env.R2_BUCKET }}/staging/articles_zim/" \
            --transfers=20 --checkers=20 --stats=30s

          COUNT=$(find "${{ env.ARTICLES_DIR }}" -maxdepth 1 -name "*.json" | wc -l)
          echo "✅ $COUNT Artikel nach staging/articles_zim/ hochgeladen"
          echo "- 📦 Staging-Upload: **$COUNT Artikel**" >> $GITHUB_STEP_SUMMARY
