name: wissensfreund_app
description: "Wissensfreund – KI-Wissensbegleiter für Kinder"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  just_audio: ^0.10.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  http: ^1.2.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  local_auth: ^3.0.0
  archive: ^4.0.0
  path_provider: ^2.1.0
  connectivity_plus: ^7.0.0
  crypto: ^3.0.0
  convert: ^3.1.0
  photo_view_plus: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/test/
    - assets/test/images/
